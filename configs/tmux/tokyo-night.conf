# Tokyo Night for tmux (palette: Omarchy themes/tokyo-night/colors.toml). Sourced from tmux.conf.
# bg #1a1b26  bg_hl #292e42  border #3b4261  fg #a9b1d6  comment #565f89  blue #7aa2f7  cyan #7dcfff

set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-style "fg=#7aa2f7,bold"
set -g status-right-style "fg=#565f89"
set -g status-right "#[fg=#565f89]%d.%m %H:%M "

# window list: active = light blue badge, others = muted
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=#565f89,bg=#1a1b26"
set -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g window-status-activity-style "fg=#e0af68,bg=#1a1b26"
set -g window-status-bell-style "fg=#f7768e,bg=#1a1b26"
set -g window-status-separator ""

# pane borders: active = light blue
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines single

# messages, prompts, copy-mode selection, clock
set -g message-style "fg=#7dcfff,bg=#292e42"
set -g message-command-style "fg=#7dcfff,bg=#292e42"
set -g mode-style "fg=#1a1b26,bg=#ffc777"  # copy-mode / mouse selection: bright yellow
set -g clock-mode-colour "#7aa2f7"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#3b4261"
