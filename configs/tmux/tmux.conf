# Om tmux config. install.sh adds to ~/.tmux.conf:  source-file ~/.local/share/om/configs/tmux/tmux.conf
set -g mouse on
# Truecolor passthrough for foot (mc Tokyo Night skin, nvim themes)
set -as terminal-features ',foot*:RGB'

# Prefix Ctrl+Space (as in Omarchy). Ctrl+b stays free for tmux on remote servers (nested tmux over ssh).
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# F12: pass ALL keys to the inner (remote) tmux; status bar turns grey. F12 again = back.
bind -T root F12 set prefix None \; set key-table off \; set status-style "fg=colour245,bg=colour238" \; if -F '#{pane_in_mode}' 'send-keys -X cancel' \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; set -u status-style \; refresh-client -S

# Status bar on top, local host name on the left (remote tmux keeps its bar at the bottom)
set -g status-position top
set -g status-left "#[bold]#H: "

# Tokyo Night colours (light-blue active window/pane, bright-yellow selection)
source-file -q ~/.local/share/om/configs/tmux/tokyo-night.conf
