# foot config for Om. Based on omacom/omarchy config/foot/foot.ini (MIT)
# Colours: tokyo-night.ini (Omarchy template). Docs: man foot.ini, /etc/xdg/foot/foot.ini
[main]
include=~/.config/foot/tokyo-night.ini
# term: foot (default) is fine; servers lacking foot terminfo -> `infocmp -x foot | ssh host tic -x -`
font=Roboto Mono:size=9
pad=10x8
initial-window-mode=windowed


[scrollback]
lines=10000
multiplier=5.0

[cursor]
style=block
blink=no
# cursor colour (text background): Tokyo Night
color=1a1b26 c0caf5

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
