# Tokyo Night skin for Midnight Commander — matches the Om (Hyprland/waybar) theme.
# Palette: Omarchy themes/tokyo-night/colors.toml + tokyonight "night".
# Needs S-Lang mc, TERM with 256 colors and COLORTERM=truecolor (foot: yes; tmux: needs RGB feature).

[skin]
    description = Tokyo Night (truecolor)
    256colors = true
    truecolors = true

[aliases]
    Bg        = #1a1b26
    BgDark    = #16161e
    BgHl      = #292e42
    BgFloat   = #1f2335
    BgLight   = #24283b
    Sel       = #283457
    Sel2      = #364a82
    Muted     = #414868
    Gutter    = #3b4261
    Comment   = #565f89
    Fg        = #a9b1d6
    FgBr      = #c0caf5
    Blue      = #7aa2f7
    Blue2     = #3d59a1
    Cyan      = #7dcfff
    Cyan2     = #2ac3de
    Teal      = #73daca
    Teal2     = #b4f9f8
    Green     = #9ece6a
    Magenta   = #bb9af7
    Red       = #f7768e
    Red2      = #db4b4b
    Orange    = #ff9e64
    Yellow    = #e0af68
    DiffAdd   = #20303b
    DiffDel   = #37222c
    DiffChg   = #1f2231
    DiffTxt   = #394b70

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = Fg;Bg
    selected = FgBr;Sel;bold
    marked = Yellow;Bg;bold
    markselect = Yellow;Sel;bold
    gauge = Bg;Blue
    input = FgBr;BgHl
    inputunchanged = Comment;BgHl
    inputmark = FgBr;Sel2
    disabled = Comment;BgLight
    reverse = Bg;Blue
    commandlinemark = FgBr;Sel2
    header = Blue;Bg;bold
    inputhistory = Comment;BgHl
    commandhistory = Comment;Bg
    shadow = BgDark;BgDark

[dialog]
    _default_ = Fg;BgLight
    dfocus = FgBr;Sel2
    dhotnormal = Orange;BgLight
    dhotfocus = Orange;Sel2
    dtitle = Blue;BgLight;bold

[error]
    _default_ = FgBr;DiffDel
    errdfocus = Bg;Red
    errdhotnormal = Orange;DiffDel
    errdhotfocus = Bg;Red;underline
    errdtitle = Red;DiffDel;bold

[filehighlight]
    directory = Blue;
    executable = Green;
    symlink = Cyan;
    hardlink = Teal;
    stalelink = Red;
    device = Orange;
    special = Yellow;
    core = Red2;
    temp = Comment;
    archive = Magenta;
    doc = Teal2;
    source = Orange;
    media = Cyan2;
    graph = Teal;
    database = Yellow;

[menu]
    _default_ = Fg;BgDark
    menusel = Bg;Blue
    menuhot = Orange;BgDark
    menuhotsel = Bg;Blue;underline
    menuinactive = Comment;BgDark

[popupmenu]
    _default_ = Fg;BgLight
    menusel = FgBr;Sel2
    menutitle = Blue;BgLight;bold

[buttonbar]
    hotkey = Blue;BgDark;bold
    button = Fg;BgHl

[statusbar]
    _default_ = Comment;BgDark

[help]
    _default_ = Fg;BgFloat
    helpitalic = Magenta;BgFloat;italic
    helpbold = Blue;BgFloat;bold
    helplink = Cyan;BgFloat;underline
    helpslink = Bg;Cyan
    helptitle = Blue;BgFloat;bold

[editor]
    _default_ = Fg;Bg
    editbold = Yellow;Bg;bold
    editmarked = FgBr;Sel
    editwhitespace = Gutter;Bg
    editnonprintable = Red;BgDark
    editlinestate = Gutter;BgDark
    bookmark = FgBr;Blue2
    bookmarkfound = Bg;Yellow
    editrightmargin = Gutter;BgFloat
    editbg = ;BgDark
    editframe = Muted;
    editframeactive = Blue;
    editframedrag = Green;

[viewer]
    _default_ = Fg;Bg
    viewbold = Blue;Bg;bold
    viewunderline = Green;Bg;underline
    viewselected = FgBr;Sel

[diffviewer]
    added = FgBr;DiffAdd
    changedline = Fg;DiffChg
    changednew = FgBr;DiffTxt
    changed = Fg;DiffChg
    removed = FgBr;DiffDel
    error = Red;BgLight

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
