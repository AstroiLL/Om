# Tokyo Night skin for Midnight Commander — matches the Om (Hyprland/waybar) theme.
# Palette: Omarchy themes/tokyo-night/colors.toml + tokyonight "night".
# Fallback for terminals without truecolor (linux console via ssh, old tmux).

[skin]
    description = Tokyo Night (256 colors)
    256colors = true


[aliases]
    Bg        = color234
    BgDark    = color234
    BgHl      = color236
    BgFloat   = color235
    BgLight   = color236
    Sel       = color237
    Sel2      = color60
    Muted     = color239
    Gutter    = color239
    Comment   = color60
    Fg        = color146
    FgBr      = color153
    Blue      = color111
    Blue2     = color61
    Cyan      = color117
    Cyan2     = color38
    Teal      = color80
    Teal2     = color159
    Green     = color149
    Magenta   = color141
    Red       = color210
    Red2      = color167
    Orange    = color215
    Yellow    = color179
    DiffAdd   = color236
    DiffDel   = color236
    DiffChg   = color235
    DiffTxt   = color239

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = Fg;Bg
    selected = FgBr;Sel;bold
    marked = Yellow;Bg;bold
    markselect = Yellow;Sel;bold
    gauge = Bg;Blue
    input = FgBr;BgHl
    inputunchanged = Comment;BgHl
    inputmark = FgBr;Sel2
    disabled = Comment;BgLight
    reverse = Bg;Blue
    commandlinemark = FgBr;Sel2
    header = Blue;Bg;bold
    inputhistory = Comment;BgHl
    commandhistory = Comment;Bg
    shadow = BgDark;BgDark

[dialog]
    _default_ = Fg;BgLight
    dfocus = FgBr;Sel2
    dhotnormal = Orange;BgLight
    dhotfocus = Orange;Sel2
    dtitle = Blue;BgLight;bold

[error]
    _default_ = FgBr;DiffDel
    errdfocus = Bg;Red
    errdhotnormal = Orange;DiffDel
    errdhotfocus = Bg;Red;underline
    errdtitle = Red;DiffDel;bold

[filehighlight]
    directory = Blue;
    executable = Green;
    symlink = Cyan;
    hardlink = Teal;
    stalelink = Red;
    device = Orange;
    special = Yellow;
    core = Red2;
    temp = Comment;
    archive = Magenta;
    doc = Teal2;
    source = Orange;
    media = Cyan2;
    graph = Teal;
    database = Yellow;

[menu]
    _default_ = Fg;BgDark
    menusel = Bg;Blue
    menuhot = Orange;BgDark
    menuhotsel = Bg;Blue;underline
    menuinactive = Comment;BgDark

[popupmenu]
    _default_ = Fg;BgLight
    menusel = FgBr;Sel2
    menutitle = Blue;BgLight;bold

[buttonbar]
    hotkey = Blue;BgDark;bold
    button = Fg;BgHl

[statusbar]
    _default_ = Comment;BgDark

[help]
    _default_ = Fg;BgFloat
    helpitalic = Magenta;BgFloat;italic
    helpbold = Blue;BgFloat;bold
    helplink = Cyan;BgFloat;underline
    helpslink = Bg;Cyan
    helptitle = Blue;BgFloat;bold

[editor]
    _default_ = Fg;Bg
    editbold = Yellow;Bg;bold
    editmarked = FgBr;Sel
    editwhitespace = Gutter;Bg
    editnonprintable = Red;BgDark
    editlinestate = Gutter;BgDark
    bookmark = FgBr;Blue2
    bookmarkfound = Bg;Yellow
    editrightmargin = Gutter;BgFloat
    editbg = ;BgDark
    editframe = Muted;
    editframeactive = Blue;
    editframedrag = Green;

[viewer]
    _default_ = Fg;Bg
    viewbold = Blue;Bg;bold
    viewunderline = Green;Bg;underline
    viewselected = FgBr;Sel

[diffviewer]
    added = FgBr;DiffAdd
    changedline = Fg;DiffChg
    changednew = FgBr;DiffTxt
    changed = Fg;DiffChg
    removed = FgBr;DiffDel
    error = Red;BgLight

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
